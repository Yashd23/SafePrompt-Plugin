rules:
  - id: hardcoded-secret
    patterns:
      - pattern: |
          $KEY = "$VALUE"
      - pattern: |
          $KEY: "$VALUE"
      - pattern: |
          $KEY = '$VALUE'
      - pattern: |
          $KEY: '$VALUE'
      - pattern: |
          $KEY = `$VALUE`
      - pattern: |
          $KEY: `$VALUE`
      - pattern: |
          $CREDENTIAL = "$VALUE"
      - pattern: |
          $CREDENTIAL: "$VALUE"
      - pattern: |
          $CREDENTIAL = '$VALUE'
      - pattern: |
          $CREDENTIAL: '$VALUE'
      - pattern: |
          $CREDENTIAL = `$VALUE`
      - pattern: |
          $CREDENTIAL: `$VALUE`
      - pattern: |
          $PASSWORD = "$VALUE"
      - pattern: |
          $PASSWORD: "$VALUE"
      - pattern: |
          $PASSWORD = '$VALUE'
      - pattern: |
          $PASSWORD: '$VALUE'
      - pattern: |
          $PASSWORD = `$VALUE`
      - pattern: |
          $PASSWORD: `$VALUE`
    message: "Hardcoded secret detected. Consider using environment variables."
    languages: [javascript, typescript]
    severity: WARNING

  - id: missing-authorization
    patterns:
      - pattern-either:
          - pattern: |
              function login($ARGS) {
                ...
              }
          - pattern: |
              function getUser($ARGS) {
                ...
              }
          - pattern: |
              function authenticate($ARGS) {
                ...
              }
          - pattern: |
              function auth($ARGS) {
                ...
              }
          - pattern: |
              function deleteUser($ARGS) {
                ...
              }
          - pattern: |
              function updateUser($ARGS) {
                ...
              }
          - pattern: |
              function removeUser($ARGS) {
                ...
              }
          - pattern: |
              function modifyUser($ARGS) {
                ...
              }
          - pattern: |
              function admin$FUNC($ARGS) {
                ...
              }
          - pattern: |
              function root$FUNC($ARGS) {
                ...
              }
          - pattern: |
              function superuser$FUNC($ARGS) {
                ...
              }
          - pattern: |
              const login = ($ARGS) => {
                ...
              }
          - pattern: |
              const getUser = ($ARGS) => {
                ...
              }
          - pattern: |
              const authenticate = ($ARGS) => {
                ...
              }
          - pattern: |
              const deleteUser = ($ARGS) => {
                ...
              }
          - pattern: |
              const updateUser = ($ARGS) => {
                ...
              }
          - pattern: |
              login: function($ARGS) {
                ...
              }
          - pattern: |
              getUser: function($ARGS) {
                ...
              }
          - pattern: |
              authenticate: function($ARGS) {
                ...
              }
          - pattern: |
              deleteUser: function($ARGS) {
                ...
              }
          - pattern: |
              updateUser: function($ARGS) {
                ...
              }
    message: "Function may lack authorization checks. Add role validation."
    languages: [javascript, typescript]
    severity: WARNING

  - id: package-json-secrets
    patterns:
      - pattern: |
          "$KEY": "$VALUE"
      - pattern: |
          '$KEY': '$VALUE'
      - pattern: |
          "$KEY": '$VALUE'
      - pattern: |
          '$KEY': "$VALUE"
      - pattern: |
          "$CREDENTIAL": "$VALUE"
      - pattern: |
          '$CREDENTIAL': '$VALUE'
      - pattern: |
          "$CREDENTIAL": '$VALUE'
      - pattern: |
          '$CREDENTIAL': "$VALUE"
      - pattern: |
          "$PASSWORD": "$VALUE"
      - pattern: |
          '$PASSWORD': '$VALUE'
      - pattern: |
          "$PASSWORD": '$VALUE'
      - pattern: |
          '$PASSWORD': "$VALUE"
    message: "Potential hardcoded secret in package.json. Use environment variables."
    languages: [json]
    severity: WARNING

  - id: vulnerable-dependencies
    patterns:
      - pattern: |
          "lodash": "$VERSION"
      - pattern: |
          "axios": "$VERSION"
      - pattern: |
          "moment": "$VERSION"
      - pattern: |
          "express": "$VERSION"
      - pattern: |
          "jquery": "$VERSION"
      - pattern: |
          "react": "$VERSION"
      - pattern: |
          "vue": "$VERSION"
      - pattern: |
          "angular": "$VERSION"
    message: "Dependency may have known vulnerabilities. Update to latest secure version."
    languages: [json]
    severity: ERROR

  - id: dev-dependency-in-production
    patterns:
      - pattern: |
          "dependencies": {
            ...
            "@types/$PACKAGE": "$VERSION"
            ...
          }
      - pattern: |
          "dependencies": {
            ...
            "typescript": "$VERSION"
            ...
          }
      - pattern: |
          "dependencies": {
            ...
            "eslint": "$VERSION"
            ...
          }
      - pattern: |
          "dependencies": {
            ...
            "prettier": "$VERSION"
            ...
          }
    message: "Development dependency should not be in production dependencies."
    languages: [json]
    severity: WARNING

  - id: ssrf-vulnerability
    patterns:
      - pattern: |
          fetch($URL)
      - pattern: |
          axios.get($URL)
      - pattern: |
          axios.post($URL, ...)
      - pattern: |
          axios.put($URL, ...)
      - pattern: |
          axios.delete($URL, ...)
      - pattern: |
          axios.patch($URL, ...)
      - pattern: |
          axios.head($URL, ...)
      - pattern: |
          axios.options($URL, ...)
      - pattern: |
          request($URL)
      - pattern: |
          http.get($URL)
      - pattern: |
          http.post($URL, ...)
      - pattern: |
          https.get($URL)
      - pattern: |
          https.post($URL, ...)
      - pattern: |
          $.get($URL)
      - pattern: |
          $.post($URL, ...)
      - pattern: |
          $.ajax({url: $URL})
      - pattern: |
          XMLHttpRequest.open($METHOD, $URL)
      - pattern: |
          new XMLHttpRequest().open($METHOD, $URL)
    message: "Potential SSRF vulnerability: HTTP request with user-controlled URL. Validate and sanitize URL before making requests."
    languages: [javascript, typescript]
    severity: ERROR

  - id: ssrf-user-input
    patterns:
      - pattern: |
          fetch(req.query.$PARAM)
      - pattern: |
          fetch(req.params.$PARAM)
      - pattern: |
          fetch(req.body.$PARAM)
      - pattern: |
          fetch(req.headers.$PARAM)
      - pattern: |
          axios.get(req.query.$PARAM)
      - pattern: |
          axios.get(req.params.$PARAM)
      - pattern: |
          axios.get(req.body.$PARAM)
      - pattern: |
          axios.get(req.headers.$PARAM)
      - pattern: |
          axios.post(req.query.$PARAM, ...)
      - pattern: |
          axios.post(req.params.$PARAM, ...)
      - pattern: |
          axios.post(req.body.$PARAM, ...)
      - pattern: |
          axios.post(req.headers.$PARAM, ...)
      - pattern: |
          request(req.query.$PARAM)
      - pattern: |
          request(req.params.$PARAM)
      - pattern: |
          request(req.body.$PARAM)
      - pattern: |
          request(req.headers.$PARAM)
      - pattern: |
          http.get(req.query.$PARAM)
      - pattern: |
          http.get(req.params.$PARAM)
      - pattern: |
          http.get(req.body.$PARAM)
      - pattern: |
          http.get(req.headers.$PARAM)
      - pattern: |
          $.get(req.query.$PARAM)
      - pattern: |
          $.post(req.query.$PARAM, ...)
      - pattern: |
          $.ajax({url: req.query.$PARAM})
      - pattern: |
          XMLHttpRequest.open($METHOD, req.query.$PARAM)
      - pattern: |
          XMLHttpRequest.open($METHOD, req.params.$PARAM)
      - pattern: |
          XMLHttpRequest.open($METHOD, req.body.$PARAM)
      - pattern: |
          XMLHttpRequest.open($METHOD, req.headers.$PARAM)
    message: "SSRF vulnerability: HTTP request with user-controlled input. Validate URL origin and use allowlist of permitted domains."
    languages: [javascript, typescript]
    severity: ERROR